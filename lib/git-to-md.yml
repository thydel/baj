- id:
  ns: git2md

- id: git-url
  sh: git config --get remote.origin.url

- id: git-repo
  jq: split(":")[1]
  sh: git-url | self -Rr

- id: git-site
  jq: split(":")[0]|split("@")[1]
  sh: git-url | self -Rr

- id: git-repo-to-url
  jq: |-
    [inputs] | "https://\(first)/\(last)"
  sh: |-
    { git-site; git-repo; } | self -nRr

- id: git-repo-to-md
  sh: git-repo-to-url | git-url-to-md repo
- { id: gr2md, sh: git-repo-to-md "$@" }

- m4:
    prefix: |-
      "\n    " as $s

- id: git-url-to-md
  jq: |-
    prefix
    | (if $what == "repo" then split("/")[-1] else split("/")[7:] | join("/") end) as $p
    | "[\($p)]:\($s)\(.)\($s)\"github.com \($what)\"\n"
  sh: self -Rr --arg what ${1:-file}

- id: check-tty
  sh: |-
    [ -t 0 ] && fail "input shouldn't be a TTY"

- id: git-branch-or-tag
  sh: if [ "$1" ]; then git tag | grep $1 || fail no $1 tag; else git branch --show-current; fi

- id: git-file-to-url
  sh: xargs -ri echo https://$(git-site)/$(git-repo)/blob/$(git-branch-or-tag "$@")/{}

- id: git-file-to-md
  sh: check-tty; git-file-to-url "$@" | git-url-to-md
- { id: gf2md, sh: git-file-to-md "$@" }

- id: git-repo-to-js
  jq: '{ url: .}'
  sh: git-repo-to-url | self -R

- id: git-commit-to-js
  sh: |-
    pretty='{ _XXX_comment_XXX_: _XXX_%s_XXX_, _XXX_commit_XXX_: _XXX_%H_XXX_ }'
    git log -${1:-1} --pretty="$pretty" | sed -e 's/"/\\"/g' -e 's/_XXX_/"/g'

- id: git-repo-and-commit-to-js
  jq: input as $r | [inputs] | map([$r, .] | add)[]
  sh: |-
    { git-repo-to-js; git-commit-to-js "$@"; } | self -n

- id: git-commit-to-md
  lv: [ id ]
  jq: |-
    prefix | "[\(.comment)]:\($s)\(.url)/commit/\(.commit)\($s)\"github.com commit\"\n"
  sh: |-
    git-repo-and-commit-to-js "$@" | self -r; alias gc2md=$id
- { id: gc2md, sh: git-commit-to-md "$@" }

- id: relative-file-to-js
  jq: |-
    { url: ., name: . }
  sh: self -R
    
- id: relative-file-to-md
  jq: |-
    prefix | "[\(.name)]:\($s)\(.url)\($s)\"github.com relative file\"\n"
  sh: |-
    check-tty; relative-file-to-js | self -r
