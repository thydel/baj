---

  # all id are in namespace `bajl`
- id:
  ns: bajl

  # listed id are «funarg» macros (.i.e bash aliases ending in ' ')
- id: [ loop, args, map ]
  is: [ fa ]

  # aliases of all listed id will be unaliased after bash sourced
  # .i.e. you can use aliases in lib src (this file) but not in bash REPL after the resulting bash is sourced
- id: [ txt1, nss1, fn1, listid1, fn1, def1, ids1, forget1, lib1, exp1, warn, optal ]
  is: [ na ]

  # listed object keys are not included as a local var
- { ky: [ tt ], is: [ nv ] }

- id: opts
  sh: |-
    # Use «local -A opts; local args cont; opts "$@"» in caller
    local opt val tmp i; args=()
    until [[ $# -eq 0 ]]; do
        case "$1" in
            --) shift; break;;
            --*=*) opt="${1%%=*}"; val="${1#*=}"; opts["${opt:2}"]="$val"; shift;;
            --*) opts["${1:2}"]="1"; shift;;
            -[0-9]*) args+=("$1"); shift;;
            -) args+=("$1"); shift;;
            -*) tmp=${1:1}
                for ((i = 0; i < ${#tmp}; i++ )); do
                    opt="${tmp:$i:1}"
                    opts[$opt]=$((opts[$opt] + 1))
                done
                shift;;
            *) args+=("$1"); shift;;
        esac
    done; cont=("$@")
  tt: |
    local -A opts; local args cont; opts "$@"

- id: md2js
  jq:
    header: |-
      [{ m4: { ME: "\($ns)" }}, { id, ns: "ME" }] + input
    md2js: |-
      def txt: .c[2] | map(.c // " ") | join("");
      def f($b):
        if $b.t == "Header" then ($b | txt) as $h |
          if $h | startswith("id ") then . + [{id: $h[3:]}] else . + [null] end
        elif $b.t == "CodeBlock" and .[-1] then
          .[-1][$b.c[0][1][0] // "txt"] = $b.c[1]
        end;
      .blocks | reduce .[] as $b ([]; f($b)) | map(values)
  sh: |-
    pandoc -t json | jq "${jq[md2js]}" | jq "${jq[header]}" -n --arg ns ${1:?}

- m4:
    NS: |-
      ${FUNCNAME%%:*}
    ID: |-
      ${FUNCNAME#*:}
    SELF: |-
      jq "$jq" $@
    OPTS: |-
      local -A opts; local args cont; opts "$«@»"

- { id: fail, sh: 'unset -v fail; : "${fail:?${FUNCNAME[1]} $@}"' }
- { id: loop, sh: 'local i; for i in "${@:2}"; do $1 "$i"; done' }
- { id: list, sh: loop echo "$@" }
- { id: args, sh: 'mapfile -t; ((${#MAPFILE[@]} > 0)) && "${@:-echo}" "${MAPFILE[@]}"' }
- { id: map, sh: 'while read; do "${@:-echo}" "$REPLY"; done' }

- { id: self, sh: jq "$jq" "$@" }
- { id: tst, sh: '< ${1:?}' }
- { id: txt, sh: 'loop tst "$@" && cat "$@" | txt1' }
- { id: txt1, sh: 'header; asjs | bm4 | dist | emit' }

- { id: nss, sh: 'loop nss1 "$@"' }
- { id: nss1, jq: '.[].ns // empty', sh: '< ${1:?} yq -oj | self -r' }

- { id: listid, sh: 'loop listid1 "$@"' }
- { id: listid1, sh: 'compgen -c ${1:?}:; compgen -c ns:${1:?}' }

- { id: ids, sh: loop ids1 "$@" }
- { id: ids1, jq: '.[].id', sh: 'eval ${1:?} src | SELF(-r)' }

- { id: fn, sh: loop fn1 "$@" }
- { id: fn1, sh: 'listid1 ${1:?} | args declare -f' }

- { id: fns, sh: ids "$@" | args def }
- { id: def, sh: loop def1 "$@" }
- { id: def1, sh: '[[ -v BASH_ALIASES[${1:?}] ]] || fail $1 not an alias && declare -f ${BASH_ALIASES[$1]}' }

- { id: ns, sh: '(($# == 0)) || fail too many args; compgen -c ns: | cut -d: -f2' }

- { id: nsp, sh: 'compgen -c ns:${1:?} > /dev/null' }

- { id: aliases, sh: loop aliases1 "$@" }
- id: aliases1
  jq: |-
    $ARGS.positional | [.[:$n], .[$n:]] | transpose[] | select(last | test("\($ns):")) | first
  sh: |-
    nsp ${1:?} || fail not a ns; self -nr --arg ns $1 --argjson n ${#BASH_ALIASES[@]} --args "${!BASH_ALIASES[@]}" "${BASH_ALIASES[@]}"

- { id: forget, sh: 'loop forget1 "$@"' }
- id: forget1
  sh: |-
    . <(NS:listid1 ${1:?} | args echo unset -f; nsp $1 && { aliases $1 | args echo unalias; echo unalias $1; })

- { id: load, sh: forget $(nss "$@"); . <(NS:txt "$@") }

- { id: warn, sh: 'echo \# generated by ${FUNCNAME[1]}, avoid edit' }
- { id: optal, sh: echo shopt -s expand_aliases }
- { id: prudent, sh: echo set -euo pipefail; echo shopt -s inherit_errexit }

- { id: exp1, sh: 'listid ${1:?} | args echo export -f' }
- { id: exp, sh: loop exp1 "$@" }

- { id: lib1, sh: 'nsp ${1:?} || fail not a ns; alias $1; alias $(aliases $1); fn $1' }
- { id: lib, sh: optal; loop lib1 "$@"; def self; exp "$@" }

- id: with-lib
  sh: >-
    (($#)) || fail; optal;
    until [[ $# == 0 || $1 == -- ]]; do lib1 $1; shift; done;
    [[ $1 == -- ]] && shift; def self;
    (($#)) && { f=${BASH_ALIASES[$1]:-$1}; shift; echo $f "${@@Q}"; }

- { id: as-lib, sh: warn; lib "$@" }
- { id: as-cmd, sh: as-lib "$@"; echo 'eval "$@"' }

- id: yml2sh
  sh: |
    load ${1:?}; nss1 $1 | args as-cmd
