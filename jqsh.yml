- id:
  ns: jqsh

- id: args
  sh: |-
    # Use «local -A opts; local args cont; args "$@"» in caller
    local opt val tmp i; args=()
    until [[ $# -eq 0 ]]; do
        case "$1" in
            --) shift; break;;
            --*=*) opt="${1%%=*}"; val="${1#*=}"; opts["${opt:2}"]="$val"; shift;;
            --*) opts["${1:2}"]="1"; shift;;
            -[0-9]*) args+=("$1"); shift;;
            -) args+=("$1"); shift;;
            -*) tmp=${1:1}
                for ((i = 0; i < ${#tmp}; i++ )); do
                    opt="${tmp:$i:1}"
                    opts[$opt]=$((opts[$opt] + 1))
                done
                shift;;
            *) args+=("$1"); shift;;
        esac
    done; cont=("$@")

- m4:
    ARGS: |-
      local -A opts; local args cont; args "«$»@"

- { id: fail, sh: 'unset -v fail; : "${fail:?${FUNCNAME[1]} $@}"' }
- { id: loop, sh: 'local i; for i in "${@:2}"; do $1 "$i"; done' }
- { id: list, sh: loop echo "$@" }
- { id: args, sh: 'mapfile -t; ((${#MAPFILE[@]} > 0)) && "${@:-echo}" "${MAPFILE[@]}"' }
- { id: map, sh: 'while read; do "${@:-echo}" "$REPLY"; done' }

- id: asjs
  sh: |-
    if test -v Y2J_USE_PYTHON;
    then python3 -c 'import sys, yaml, json; print(json.dumps(yaml.safe_load(sys.stdin.read())))';
    else yq -oj "$@"; fi

- { id: tst, sh: '< ${1:?}' }
- { id: txt1, sh: 'baj-mini-head; asjs | baj-m4 | baj-ids | baj-mini-emit' }
- { id: txt, sh: 'loop $ns:tst "$@" && cat "$@" | txt1' }
